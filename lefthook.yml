pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,tsx,astro,js,jsx}"
      run: npx eslint --fix {staged_files} && git add {staged_files}
    format:
      glob: "*.{json,css,md}"
      run: npx prettier --write {staged_files} && git add {staged_files}
    typecheck:
      run: npx tsc --noEmit
    test:
      glob: "*.{ts,tsx}"
      run: npx vitest related {staged_files} --run
