name: AI code review
description: >-
  Build and test packages/code-reviewer, run one OpenRouter review of a PR diff,
  and decide the job outcome (blocking on review quality, fail-open on infra).

inputs:
  openrouter-api-key:
    description: OpenRouter API key. Passed to the CLI as OPENROUTER_API_KEY on the review step only.
    required: true
  pr-number:
    description: PR number — used to address `gh pr comment` / `gh pr edit` for the comment and verdict labels.
    required: true
  pr-title:
    description: PR title — drives the pr_clarity criterion.
    required: true
  pr-description:
    description: PR description / body.
    required: false
    default: ""
  diff:
    description: The (possibly truncated) unified diff to review.
    required: true
  fail-below:
    description: Fail the job if any criterion scores below this integer (1..10).
    required: false
    default: "5"
  model:
    description: OpenRouter model slug.
    required: false
    default: "anthropic/claude-sonnet-4.5"
  max-output-tokens:
    description: Generation ceiling for the single model call.
    required: false
    default: "8000"
  max-cost:
    description: Passed to stopWhen; inert for this single-call design (kept for a future tools variant).
    required: false
    default: "0.5"
  timeout-ms:
    description: Wall-clock deadline for the model call, in milliseconds.
    required: false
    default: "300000"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install code-reviewer deps
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci

    - name: Build code-reviewer
      shell: bash
      working-directory: packages/code-reviewer
      run: npm run build

    - name: Run review
      id: review
      shell: bash
      env:
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        DIFF: ${{ inputs.diff }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_DESCRIPTION: ${{ inputs.pr-description }}
        MODEL: ${{ inputs.model }}
        FAIL_BELOW: ${{ inputs.fail-below }}
        MAX_OUTPUT_TOKENS: ${{ inputs.max-output-tokens }}
        MAX_COST: ${{ inputs.max-cost }}
        TIMEOUT_MS: ${{ inputs.timeout-ms }}
      run: |
        set +e +o pipefail
        node packages/code-reviewer/dist/cli.js \
          --pr-title "$PR_TITLE" \
          --pr-description "$PR_DESCRIPTION" \
          --diff "$DIFF" \
          --model "$MODEL" \
          --fail-below "$FAIL_BELOW" \
          --max-output-tokens "$MAX_OUTPUT_TOKENS" \
          --max-cost "$MAX_COST" \
          --timeout-ms "$TIMEOUT_MS" \
          --format markdown \
          --out "$RUNNER_TEMP/review.json" \
          | tee "$RUNNER_TEMP/review.md" | tee -a "$GITHUB_STEP_SUMMARY"
        rc=${PIPESTATUS[0]}
        echo "code=${rc}" >> "$GITHUB_OUTPUT"

    - name: Dump review.json
      shell: bash
      run: cat "$RUNNER_TEMP/review.json" || true

    - name: Build PR comment body
      id: comment
      shell: bash
      env:
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        # LC_ALL=C so `wc -c` / `head -c` count bytes, matching the diff step.
        export LC_ALL=C
        REVIEW_JSON="$RUNNER_TEMP/review.json"
        REVIEW_MD="$RUNNER_TEMP/review.md"
        BODY="$RUNNER_TEMP/comment.md"
        DECISION="$(jq -r '.decision // "error"' "$REVIEW_JSON" 2>/dev/null || echo error)"
        {
          echo "🤖 AI code review · [run]($RUN_URL)"
          echo
        } > "$BODY"
        if [ "$DECISION" = "error" ]; then
          ERR="$(jq -r '.error // "unknown error"' "$REVIEW_JSON" 2>/dev/null || echo "unknown error")"
          {
            echo "### ⚠️ AI code review could not run"
            echo
            echo "\`${ERR}\`"
            echo
            echo "_Not blocking the PR (fail-open on infra); verdict labels left unchanged._"
          } >> "$BODY"
        elif [ -f "$REVIEW_MD" ] && [ "$(wc -c < "$REVIEW_MD")" -gt 60000 ]; then
          head -c 60000 "$REVIEW_MD" >> "$BODY"
          {
            echo
            echo
            echo "_…truncated — full review in the [run summary]($RUN_URL)._"
          } >> "$BODY"
        else
          cat "$REVIEW_MD" >> "$BODY" 2>/dev/null \
            || echo "_(review output unavailable — see the [run summary]($RUN_URL).)_" >> "$BODY"
        fi
        echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"

    - name: Post PR comment
      if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" \
          || echo "::warning::failed to post the AI code review PR comment"

    - name: Set verdict label
      if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        DECISION: ${{ steps.comment.outputs.decision }}
      run: |
        set -euo pipefail
        case "$DECISION" in
          pass) gh pr edit "$PR_NUMBER" --add-label "ai-cr:passed" --remove-label "ai-cr:failed" \
                  || echo "::warning::failed to set ai-cr:passed" ;;
          fail) gh pr edit "$PR_NUMBER" --add-label "ai-cr:failed" --remove-label "ai-cr:passed" \
                  || echo "::warning::failed to set ai-cr:failed" ;;
          *)    echo "decision=$DECISION — leaving verdict labels unchanged" ;;
        esac

    - name: Clear retry label
      if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
      run: |
        gh pr edit "$PR_NUMBER" --remove-label "ai-cr:review" \
          || echo "::warning::failed to clear ai-cr:review"

    - name: Gate on review outcome
      shell: bash
      env:
        CODE: ${{ steps.review.outputs.code }}
        FAIL_BELOW: ${{ inputs.fail-below }}
      run: |
        set -euo pipefail
        case "${CODE}" in
          0)
            echo "AI code review passed (every criterion >= fail-below=${FAIL_BELOW})."
            ;;
          1)
            echo "::error::AI code review failed — a criterion scored below fail-below=${FAIL_BELOW}"
            exit 1
            ;;
          2 | 3)
            echo "::error::AI code review could not run (CLI exit ${CODE}); not blocking the PR (fail-open on infra)"
            ;;
          *)
            echo "::error::AI code review returned an unexpected CLI exit '${CODE}'; not blocking the PR"
            ;;
        esac
